<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f0e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Montenegro">
<title>Montenegro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true"><span class="wordmark">montenegro<span>.</span></span></div>
<div id="lock" hidden>
  <div class="lock-art" aria-hidden="true"></div>
  <div class="card lock-card">
    <div class="lock-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
    <div class="eyebrow">Besloten</div>
    <h1>De reis begint hier.</h1>
    <p class="muted">Vul het wachtwoord in dat je van de reisleider hebt gekregen. Dit toestel onthoudt het daarna.</p>
    <label class="sr-only" for="pw">Wachtwoord</label>
    <input class="i" id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord">
    <div class="err" id="pwerr" role="status"></div>
    <button class="btn" id="pwgo">Open onze reis</button>
  </div>
</div>

<div id="app" hidden>
  <main id="main">
    <section class="view" id="v-vandaag"></section>
    <section class="view" id="v-reis"></section>
    <section class="view" id="v-ontdek"></section>
    <section class="view" id="v-info"></section>
  </main>
  <nav aria-label="Hoofdnavigatie">
    <span class="nav-pill" aria-hidden="true"></span>
    <button data-tab="vandaag"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Vandaag</button>
    <button data-tab="reis"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 5h7a4 4 0 0 1 0 8H9a3 3 0 0 0 0 6h7"/></svg>Reis</button>
    <button data-tab="ontdek"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg>Ontdek</button>
    <button data-tab="info"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Info</button>
  </nav>
</div>

<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
