/* The journey opens inside the landscape. Practical screens retain their quiet layout. */

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function decryptTrip(enc,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(enc.iv)},key,b64d(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function encryptTrip(obj,key,saltB64){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {v:1,salt:saltB64,iv:b64e(iv),ct:b64e(ct)}}
async function storeKey(key){ls.set('k',b64e(await crypto.subtle.exportKey('raw',key)))}
async function loadKey(){const k=ls.get('k',null);if(!k)return null;return crypto.subtle.importKey('raw',b64d(k),{name:'AES-GCM'},true,['encrypt','decrypt'])}

const pad=n=>String(n).padStart(2,'0');
function todayStr(){const o=new URLSearchParams(location.search).get('datum');if(o)return o;const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const asDate=s=>new Date(s+'T12:00:00Z');
const addDay=(s,n=1)=>new Date(asDate(s).getTime()+n*864e5).toISOString().slice(0,10);
const diffDays=(a,b)=>Math.round((asDate(b)-asDate(a))/864e5);
const fmt=(s,o)=>asDate(s).toLocaleDateString('nl-NL',Object.assign({timeZone:'UTC'},o||{weekday:'long',day:'numeric',month:'long'}));
const fmtShort=s=>fmt(s,{weekday:'short',day:'numeric',month:'short'});
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60);return h?h+' u '+pad(m%60):m+' min'};

const dayNote=d=>(S.edits.days||{})[d]||'';
function saveEdits(){ls.set('edits',S.edits)}
function days(){const t=S.trip,out=[];for(let d=t.start;d<=t.end;d=addDay(d))out.push({date:d,stay:t.stays.find(s=>s.from<=d&&d<s.to),legs:t.legs.filter(l=>l.date===d)});return out}
function hav(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const gmaps=(lat,lng)=>'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving';

const WX={0:'Zonnig',1:'Overwegend zonnig',2:'Half bewolkt',3:'Bewolkt',45:'Mist',48:'Mist',51:'Motregen',53:'Motregen',55:'Motregen',61:'Lichte regen',63:'Regen',65:'Zware regen',71:'Sneeuw',73:'Sneeuw',75:'Sneeuw',80:'Buien',81:'Buien',82:'Zware buien',95:'Onweer',96:'Onweer',99:'Onweer'};
async function loadWeather(stay){const k='wx_'+stay.id,c=ls.get(k,null);if(c&&Date.now()-c.ts<3*36e5)return c.d;if(!navigator.onLine)return c?c.d:null;try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+stay.lat.toFixed(2)+'&longitude='+stay.lng.toFixed(2)+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16');const j=await r.json();ls.set(k,{ts:Date.now(),d:j.daily});return j.daily}catch(e){return c?c.d:null}}
async function fillWeather(el,stay,date){if(!el||!stay)return;const d=await loadWeather(stay);if(!d){el.textContent='Weer: nog niet beschikbaar (offline)';return}const i=d.time.indexOf(date);if(i<0){el.textContent='Weer: nog geen verwachting voor deze dag';return}el.textContent=(WX[d.weather_code[i]]||'Wisselend')+' · '+Math.round(d.temperature_2m_max[i])+'° / '+Math.round(d.temperature_2m_min[i])+'° · '+(d.precipitation_probability_max[i]??0)+'% kans op regen'}

function bindScenes(){const deck=$('.scene-deck'),controller=new AbortController();let timer;deck.scrollLeft=S.sceneIndex*deck.clientWidth;let hold=Date.now()+700;const sync=()=>{clearTimeout(timer);timer=setTimeout(()=>{const w=deck.clientWidth;if(!w)return;if(Date.now()<hold){if(Math.abs(deck.scrollLeft-S.sceneIndex*w)>2)deck.scrollTo({left:S.sceneIndex*w,behavior:'instant'});return}activateScene(Math.round(deck.scrollLeft/w),true)},80)};const par=()=>{const w=deck.clientWidth;if(!w)return;const pos=deck.scrollLeft/w;deck.querySelectorAll('.destination').forEach((el,i)=>{const p=i-pos;el.style.setProperty('--p',p.toFixed(3));el.style.setProperty('--pa',Math.min(1,Math.abs(p)).toFixed(3))})};let raf=0;deck.addEventListener('scroll',()=>{sync();if(!raf)raf=requestAnimationFrame(()=>{raf=0;par()})},{passive:true,signal:controller.signal});par();deck.addEventListener('keydown',e=>{if(e.target!==deck)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();goScene(S.sceneIndex+(e.key==='ArrowRight'?1:-1))}if(e.key==='Home'){e.preventDefault();goScene(0)}if(e.key==='End'){e.preventDefault();goScene(sceneStops().length-1)}},{signal:controller.signal});let width=deck.clientWidth;const observer=new ResizeObserver(()=>{if(deck.clientWidth!==width){width=deck.clientWidth;hold=Date.now()+500;deck.scrollTo({left:S.sceneIndex*width,behavior:'instant'})}});observer.observe(deck);S.sceneCleanup=()=>{controller.abort();observer.disconnect();clearTimeout(timer)}}

/* ---------- gebeurtenissen ---------- */
const TABS=['vandaag','dagen','info'];
function show(tab){const go=()=>{if(S.sceneCleanup){S.sceneCleanup();S.sceneCleanup=null}S.tab=tab;$('#app').classList.toggle('explore-mode',tab==='vandaag');document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('nav').style.setProperty('--n',TABS.indexOf(tab));({vandaag:renderVandaag,dagen:renderDagen,info:renderInfo})[tab]();window.scrollTo(0,0)};if(document.startViewTransition&&S.tab!==tab&&!$('#app').hidden)document.startViewTransition(go);else go()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab)return show(b.dataset.tab);
  if(b.id==='locbtn')return startLocation();
  if(b.id==='expbtn')return exportEnc();
  if(b.id==='lockbtn'){ls.del('k');location.reload();return}
  if(b.id==='addfl'){S.edits.flights=flights().concat([{nr:'',date:'',from:'',to:'',dep:'',arr:''}]);saveEdits();return renderInfo()}
  if(b.dataset.delfl!=null){const f=flights().slice();f.splice(+b.dataset.delfl,1);S.edits.flights=f;saveEdits();return renderInfo()}});
document.addEventListener('input',e=>{const x=e.target.dataset;if(!x)return;
  if(x.day){(S.edits.days=S.edits.days||{})[x.day]=e.target.value;saveEdits()}
  else if(x.stay){const st=S.edits.stays=S.edits.stays||{};(st[x.stay]=st[x.stay]||{})[x.f]=e.target.value;saveEdits()}
  else if(x.fl!=null){const f=flights().map(o=>Object.assign({},o));f[+x.fl][x.f]=e.target.value;S.edits.flights=f;saveEdits()}});

/* ---------- start ---------- */
function run(trip){S.trip=trip;if(trip.dayNotes){S.edits.days=Object.assign({},trip.dayNotes,S.edits.days||{})}document.title=trip.title;$('#lock').hidden=true;$('#app').hidden=false;show('vandaag');if(ls.get('loc',false))startLocation()}
async function unlock(){const pw=$('#pw').value,err=$('#pwerr'),card=$('#lock .card');if(!pw)return;err.textContent='Bezig…';try{const key=await deriveKey(pw,b64d(S.enc.salt));const trip=await decryptTrip(S.enc,key);S.key=key;await storeKey(key);$('#pw').value='';err.textContent='';$('#lock').classList.add('opening');await new Promise(r=>setTimeout(r,900));run(trip)}catch(e){err.textContent='Onjuist wachtwoord.';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}}
$('#pwgo').addEventListener('click',unlock);$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
async function boot(){if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let enc=null;try{const r=await fetch('data/trip.enc',{cache:'no-cache'});if(r.ok)enc=await r.json()}catch(e){}
  if(enc){S.enc=enc;const key=await loadKey().catch(()=>null);if(key){try{const trip=await decryptTrip(enc,key);S.key=key;return run(trip)}catch(e){ls.del('k')}}showLock();return}
  try{const r=await fetch('data/trip.json',{cache:'no-cache'});if(r.ok){S.dev=true;return run(await r.json())}}catch(e){}
  showLock();$('#pwerr').textContent='Geen reisgegevens gevonden. Open de app één keer met internet.';$('#pwgo').disabled=true}
boot();
</script>
</body>
</html>
